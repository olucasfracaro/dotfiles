format = """
$os\
$directory\
$git_branch\
$git_status\
${custom.stack}\
$docker_context\
$shell
"""

[directory]
style = "bold blue"
format = '[$path]($style)  '
#truncation_symbol = '../'
truncate_to_repo = true
truncation_length = 3

[git_branch]
symbol = " "
style = "bold yellow"
format = '[$symbol$branch(:$remote_branch)]($style) '
#ignore_branches = ['main']

[git_status]
style = "bold yellow"

[custom.stack]
description = "Mostra apenas uma versão"
command = '''
if [[ -d app/src/main/kotlin || -d src/main/kotlin ]] || \
   [[ -f app/src/main/java/com/olucasfracaro/garracio/MainActivity.kt ]] || \
   [[ -f MainActivity.kt ]]; then
  printf 'via κτ '
  grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties 2>/dev/null |
    sed -E 's/.*gradle-([0-9.]+)-.*/\1/' |
    head -n 1
elif [[ -f pom.xml ]]; then
  printf 'via 🅼 '
  mvn -version 2>/dev/null | head -n 1
elif [[ -f gradle/wrapper/gradle-wrapper.properties ]]; then
  printf 'via 🅶 '
  grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties |
    sed -E 's/.*gradle-([0-9.]+)-.*/\1/' |
    head -n 1
elif [[ -f build.gradle || -f build.gradle.kts ]]; then
  printf 'via 🅶 Gradle'
else
  exit 1
fi
'''
when = true
shell = ["bash"]
format = '[$output](bold purple) '

[sudo]
style = 'green'
symbol = '🦸‍♂️ '
disabled = false

[docker_context]
symbol = " "

[os]
format = "[$symbol]($style)"
style = "bold blue"
disabled = false

[os.symbols]
Fedora = "🎩  "

[shell]
zsh_indicator = 'ζ'
unknown_indicator = 'mystery shell'
style = 'strikethrough white'
disabled = false

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold yellow)"
