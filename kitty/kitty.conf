# -------------------------
# SHELL
# -------------------------

shell /usr/bin/zsh


# -------------------------
# FONTE
# -------------------------

font_family      0xProto Nerd Font Mono
font_size        10.5



# -------------------------
# CURSOR
# -------------------------
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

cursor #ECEFF4
cursor_text_color #1E222A



# -------------------------
# JANELA
# -------------------------

remember_window_size yes
initial_window_width  1200
initial_window_height 700

window_padding_width 1 

hide_window_decorations yes

background_opacity 0.75

dynamic_background_opacity yes


# -------------------------
# ABAS
# -------------------------

# Posição das abas
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Cores da barra
active_tab_foreground   #FFFFFF
active_tab_background   #BD93F9

inactive_tab_foreground #BFBFBF
inactive_tab_background #282A36

# Fonte das abas
tab_bar_min_tabs 2
tab_title_template "{title}"


# -------------------------
# CORES
# -------------------------

foreground              #D8DEE9
background              #1E222A

selection_foreground    #1E222A
selection_background    #1E88E5

url_color               #1E88E5

# ----------
# CORES ANSI
# ----------


# -------------------------
# TAB BAR
# -------------------------

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

tab_title_max_length 15
tab_bar_margin_width 1.0
tab_bar_margin_height 2.0 0.0

active_tab_foreground   #ECEFF4
active_tab_background   #8E24AA
active_tab_font_style   bold

inactive_tab_foreground #D8DEE9
inactive_tab_background #2E3440
inactive_tab_font_style normal

tab_title_template "{title}"
progress_bar bottom


# -------------------------
# SCROLLBACK
# -------------------------

scrollback_lines 5000

scrollbar scrolled-or-hovered
scrollbar_radius 0.5

scrollbar_handle_opacity 0.3
scrollbar_track_hover_opacity 0

scrollbar_handle_color #8E24AA

wheel_scroll_multiplier 6.0


# -------------------------
# MOUSE
# -------------------------

copy_on_select no

strip_trailing_spaces smart

url_style straight


# -------------------------
# ATALHOS
# -------------------------

# Nova aba
map ctrl+shift+t new_tab

# Fechar aba
map ctrl+shift+w close_tab

# Próxima aba
map ctrl+tab next_tab

# Aba anterior
map ctrl+shift+tab previous_tab

# Abrir shell em nova janela
map ctrl+shift+enter new_window

# Reload da configuração
map ctrl+shift+f5 load_config_file

# Paleta de comando
map f1 command_palette

# Limpa o scrollback do terminal
map f5 clear_terminal scrollback active


# -------------------------
# SPLITS
# -------------------------

# Split vertical
map ctrl+shift+v launch --location=vsplit

# Split horizontal
map ctrl+shift+h launch --location=hsplit


# -------------------------
# COPIAR / COLAR
# -------------------------

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# -------------------------
# URLS
# -------------------------

open_url_with default

detect_urls yes

